name: Build openRPGator

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM / Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            lwjgl_natives: natives-linux
          - arch: arm64
            lwjgl_natives: natives-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and test JVM modules
        run: >-
          gradle --no-daemon test
          -PlwjglNatives=${{ matrix.lwjgl_natives }}

      - name: Build Linux distributions
        run: >-
          gradle --no-daemon
          :dedicated-server:installDist
          :server-admin:installDist
          :map-editor:installDist
          :desktop-client:installDist
          -PlwjglNatives=${{ matrix.lwjgl_natives }}

      - name: Package Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          root="dist/openRPGator-linux-${{ matrix.arch }}"
          mkdir -p "$root"
          cp -a dedicated-server/build/install/dedicated-server "$root/server"
          cp -a server-admin/build/install/server-admin "$root/server-admin"
          cp -a map-editor/build/install/map-editor "$root/map-editor"
          cp -a desktop-client/build/install/desktop-client "$root/client"
          tar -C dist -czf "openRPGator-linux-${{ matrix.arch }}.tar.gz" "openRPGator-linux-${{ matrix.arch }}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: openRPGator-linux-${{ matrix.arch }}-${{ github.ref_name }}
          path: openRPGator-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  android:
    name: Android universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Configure test Android signing key
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android-client/ci-test.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=openrpgator-test" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        run: gradle --no-daemon :android-client:assembleRelease -PandroidBuild

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android-client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" dist/openRPGator-android-universal.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: openRPGator-android-universal-${{ github.ref_name }}
          path: dist/openRPGator-android-universal.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [jvm, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openRPGator-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Create release and attach builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
