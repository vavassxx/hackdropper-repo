plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'rpg.engine.android'
    compileSdk 35
    defaultConfig { applicationId 'rpg.engine.android'; minSdk 26; targetSdk 35; versionCode 30203; versionName '0.3.2.3' }
    splits { abi { enable false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_FILE') ?: file('ci-test.keystore').absolutePath
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword(System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android')
                keyAlias(System.getenv('ANDROID_KEY_ALIAS') ?: 'openrpgator-test')
                keyPassword(System.getenv('ANDROID_KEY_PASSWORD') ?: 'android')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation project(':engine-map')
    implementation project(':engine-network')
    implementation project(':engine-runtime')
    implementation project(':pak')
    // The embedded Android local server IS the PC server: same authoritative ServerHost/ServerConfig.
    implementation project(':dedicated-server')
}
