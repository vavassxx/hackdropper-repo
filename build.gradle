allprojects {
    group = 'rpg.engine'
    version = '0.3.2.3'
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    if (project.name != 'android-client') {
        apply plugin: 'java-library'
        def jvmLevel = project.hasProperty('androidBuild') ? 17 : 21
        java { toolchain { languageVersion = JavaLanguageVersion.of(jvmLevel) } }
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0' }
        tasks.withType(Test).configureEach { useJUnitPlatform() }
    }
}
